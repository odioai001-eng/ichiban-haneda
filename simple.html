<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>出退勤・売上管理（簡易版）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="出退勤・売上（簡易）">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d1a;--surface:#161628;--surface2:#1e1e35;--border:#2a2a4a;
  --text:#e8e8f4;--muted:#7878a0;--accent:#4f8ef7;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--purple:#a855f7;--cyan:#06b6d4;
  --gold:#fbbf24;--hh:70px;--nh:78px;
}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);max-width:560px;margin:0 auto;position:relative;
  padding-bottom:calc(var(--nh) + env(safe-area-inset-bottom,0px) + 10px);
  font-size:19px;line-height:1.5}
.hdr{position:sticky;top:0;width:100%;height:calc(var(--hh) + env(safe-area-inset-top,0px));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
.hdr-title{font-size:21px;font-weight:700;letter-spacing:.3px;line-height:1.25}
.hdr-status{font-size:14px;color:var(--muted);margin-top:2px}
.page{display:none}
.page.active{display:block}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  height:calc(var(--nh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:1000}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-size:13px;font-weight:700}
.nb-icon{font-size:27px;line-height:1}
.nb.active{color:var(--accent)}
.wrap{padding:16px}
.sec{font-size:16px;font-weight:700;color:var(--muted);margin:22px 0 10px;
  letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
.timer-big{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;color:var(--gold);text-align:center}
.duty-lbl{text-align:center;font-size:17px;color:var(--muted);margin-bottom:8px}
.btn{padding:16px 18px;border-radius:10px;border:none;cursor:pointer;font-size:19px;font-weight:600;transition:all .2s;line-height:1.3}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:active{transform:none}
.btn-p{background:var(--accent);color:#fff}
.btn-d{background:var(--red);color:#fff}
.btn-s{background:var(--green);color:#fff}
.btn-g{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn-full{width:100%}
input,textarea,select{width:100%;padding:16px 14px;background:var(--surface2);
  border:2px solid var(--border);border-radius:10px;color:var(--text);
  font-size:20px;margin-bottom:12px;-webkit-appearance:none;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
label{font-size:16px;color:var(--muted);display:block;margin-bottom:5px}
.row2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;margin-bottom:4px;gap:10px}
.rl{font-size:16px;color:var(--muted)}
.rv{font-size:20px;font-weight:600}
.entry-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.entry-row:last-child{border-bottom:none}
.entry-main{flex:1;font-size:17px;line-height:1.6}
.entry-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;font-size:16px;cursor:pointer}
.check-row{margin-top:16px;display:flex;align-items:center;gap:12px;font-size:19px}
.check-row input[type=checkbox]{width:28px;height:28px;margin:0;flex-shrink:0}
.toast{position:fixed;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);
  background:rgba(30,30,60,.95);color:#fff;padding:12px 22px;border-radius:24px;
  font-size:18px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .3s;
  max-width:90%;text-align:center;border:1px solid var(--border)}
.toast.show{opacity:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:2000;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:18px 18px 0 0;padding:22px;
  width:100%;max-width:560px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:21px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between}
.mc{background:none;border:none;color:var(--muted);font-size:30px;cursor:pointer;line-height:1}
#update-banner{position:fixed;left:0;right:0;top:0;z-index:99999;background:var(--accent);color:#fff;
  text-align:center;font-size:18px;font-weight:700;cursor:pointer;
  padding:14px 14px calc(14px + env(safe-area-inset-top,0px))}
.sync-status{font-size:15px;color:var(--muted);margin-top:8px;line-height:1.6}
.setup-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:5000;
  align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.setup-screen.open{display:flex}
.setup-box{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;
  border:1px solid var(--border);margin:auto}
.setup-box h2{font-size:26px;font-weight:700;margin-bottom:10px}
.setup-box p{font-size:17px;color:var(--muted);margin-bottom:18px;line-height:1.7}
</style>
</head>
<body>

<div class="setup-screen" id="setup-screen">
  <div class="setup-box">
    <h2>ようこそ 👋</h2>
    <p>出退勤の記録と個人の売上管理だけのシンプルなアプリです。まずは名前を入力してください。</p>
    <label>名前</label>
    <input type="text" id="setup-name" placeholder="例: 高橋">
    <label>同期コード（任意）</label>
    <input type="text" id="setup-sync-code" placeholder="例: 好きな文字列・数字">
    <p style="margin-bottom:10px">以前このアプリや別の端末で使ったことがある場合は、その時の同期コードを入力して「復元して始める」を押してください。初めて使う方は空欄のまま「新規に始める」でOKです。</p>
    <div class="btn-row">
      <button class="btn btn-p btn-full" onclick="completeSetup(false)">🆕 新規に始める</button>
      <button class="btn btn-g btn-full" onclick="completeSetup(true)">🔄 コードのデータを復元して始める</button>
    </div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-title" id="hdr-name">出退勤・売上管理</div>
  <div class="hdr-status" id="hdr-status">休み中</div>
</div>

<div class="page active" id="page-duty">
  <div class="wrap">
    <div id="duty-off-view">
      <div class="card" style="text-align:center">
        <div style="font-size:20px;margin-bottom:16px">本日はまだ出勤していません</div>
        <button class="btn btn-s btn-full" style="font-size:23px;padding:22px" onclick="openClockInModal()">🚕 出勤する</button>
      </div>
    </div>
    <div id="duty-on-view" style="display:none">
      <div class="card">
        <div class="row2"><span class="rl">出勤時刻</span><span class="rv" id="duty-start-disp">-</span></div>
        <div class="row2"><span class="rl">上がり予定時刻</span><span class="rv" id="duty-plan-end-disp">-</span></div>
      </div>
      <div class="card" style="text-align:center">
        <div class="duty-lbl">残り時間</div>
        <div class="timer-big" id="duty-countdown">あと --:--</div>
      </div>
      <div class="card">
        <div class="row2"><span class="rl">本日の目標売上</span><span class="rv" id="duty-target-amount-disp" style="color:var(--gold)">-</span></div>
      </div>
      <button class="btn btn-d btn-full" style="font-size:22px;padding:20px" onclick="openClockOutModal()">🏁 退勤する</button>
    </div>
  </div>
</div>

<div class="page" id="page-sales">
  <div class="wrap">
    <div class="sec">今月のまとめ</div>
    <div class="card" id="sales-tab-out"></div>
    <div class="sec">記録一覧</div>
    <div class="card" id="daily-log-list"></div>
  </div>
</div>

<div class="page" id="page-settings">
  <div class="wrap">
    <div class="sec">目標設定</div>
    <div class="card">
      <label>今月の出勤予定日数</label>
      <input type="number" id="s-target-days" inputmode="numeric" placeholder="例: 20">
      <label>今月の目標金額（税抜）</label>
      <input type="number" id="s-target-amount" inputmode="numeric" placeholder="例: 600000">
      <button class="btn btn-p btn-full" onclick="saveTargetSettings()">✅ 保存</button>
    </div>

    <div class="sec">繰越（前システム等からの引継ぎ分）</div>
    <div class="card">
      <label>繰越 売上（税抜・円）</label>
      <input type="number" id="s-carry-fare" inputmode="numeric" placeholder="0">
      <label>繰越 時間（時:分。例 85:30）</label>
      <input type="text" id="s-carry-hours" placeholder="0:00">
      <label>繰越 日数</label>
      <input type="number" id="s-carry-days" inputmode="numeric" placeholder="0">
      <div class="btn-row">
        <button class="btn btn-p" onclick="saveCarrySettings()">✅ 保存</button>
        <button class="btn btn-g" onclick="clearCarrySettings()">🗑 クリア</button>
      </div>
    </div>

    <div class="sec">端末間同期・バックアップ</div>
    <div class="card">
      <label>名前</label>
      <input type="text" id="s-name" placeholder="例: 高橋">
      <label>同期コード（他の端末にも同じコードを入力すると同じデータが見られます）</label>
      <input type="text" id="s-sync-code" placeholder="例: 好きな文字列・数字">
      <div class="btn-row">
        <button class="btn btn-p" onclick="saveSyncSettings()">✅ 保存して送信</button>
        <button class="btn btn-g" onclick="restoreFromSync()">🔄 このコードのデータを復元</button>
      </div>
      <div class="sync-status" id="sync-status"></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nb active" id="nb-duty" onclick="switchTab('duty')"><span class="nb-icon">🚕</span>出退勤</button>
  <button class="nb" id="nb-sales" onclick="switchTab('sales')"><span class="nb-icon">📊</span>売上管理</button>
  <button class="nb" id="nb-settings" onclick="switchTab('settings')"><span class="nb-icon">⚙️</span>設定</button>
</div>

<div id="toast" class="toast"></div>

<div class="overlay" id="clockin-overlay">
  <div class="modal">
    <h3>出勤<button class="mc" onclick="closeClockIn()">✕</button></h3>
    <label>出勤時刻</label>
    <input type="time" id="ci-start-time">
    <label>本日の予定時間</label>
    <div class="row2"><span class="rl">予定</span><span class="rv" id="ci-plan-disp" style="color:var(--gold)">未設定</span></div>
    <div class="btn-row">
      <button class="btn btn-g" style="flex:1" onclick="planByDailyShare()">📐 日割り時間で勤務する</button>
      <button class="btn btn-g" style="flex:1" onclick="planByEndTime()">🕐 上がり時間を指定</button>
    </div>
    <div id="ci-endtime-picker" style="display:none;margin-top:12px">
      <label>上がり予定時刻</label>
      <input type="time" id="ci-end-time-input" onchange="onManualEndTimeChange()">
    </div>
    <label class="check-row">
      <input type="checkbox" id="ci-terminal-check" onchange="updateConfirmEnabled()">
      <span>🖥️ 決済端末を持ちました</span>
    </label>
    <button class="btn btn-p btn-full" style="margin-top:16px" id="ci-confirm-btn" onclick="confirmClockIn()" disabled>✅ 出勤する</button>
  </div>
</div>

<div class="overlay" id="clockout-overlay">
  <div class="modal">
    <h3>退勤<button class="mc" onclick="closeClockOut()">✕</button></h3>
    <label>退勤時刻</label>
    <input type="time" id="co-end-time">
    <label>勤務時間（時間）</label>
    <input type="number" id="co-hours" inputmode="decimal" step="0.1">
    <label>本日の税抜き売上（円）</label>
    <input type="number" id="co-fare" inputmode="numeric" placeholder="例: 45000">
    <label>自腹高速代（円）</label>
    <input type="number" id="co-toll" inputmode="numeric" placeholder="0">
    <button class="btn btn-p btn-full" onclick="confirmClockOut()">✅ 退勤する</button>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkvfkNDnPW2jBmdWXYol52DyKwE6fDSSU",
  authDomain: "ichiban-hanedateam.firebaseapp.com",
  databaseURL: "https://ichiban-hanedateam-default-rtdb.firebaseio.com",
  projectId: "ichiban-hanedateam",
  storageBucket: "ichiban-hanedateam.firebasestorage.app",
  messagingSenderId: "775194714893",
  appId: "1:775194714893:web:b89446b29ddbc8213a0644"
};
const APP_BUILD='20260808-7';
// 今月の目標時間は個別設定せず、固定値として扱う
const MONTHLY_TARGET_HOURS_FIXED=288;

let db=null;
function tryFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
  }catch(e){}
}

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function pad(n){return String(n).padStart(2,'0');}
function fmtTime(d){return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}

function switchTab(name){
  ['duty','sales','settings'].forEach(t=>{
    document.getElementById('page-'+t).classList.toggle('active',t===name);
    document.getElementById('nb-'+t).classList.toggle('active',t===name);
  });
}

// ===== 目標・繰越 =====
function getCarryover(){
  return {
    fare:parseInt(localStorage.getItem('taxi_carry_fare')||'0')||0,
    hours:parseFloat(localStorage.getItem('taxi_carry_hours')||'0')||0,
    days:parseInt(localStorage.getItem('taxi_carry_days')||'0')||0
  };
}
function parseClockHours(str){
  str=(str||'').trim();
  if(!str)return 0;
  const m=str.match(/^(\d+)[:：](\d{1,2})$/);
  if(m)return Math.round((parseInt(m[1],10)+parseInt(m[2],10)/60)*100)/100;
  const f=parseFloat(str);
  return isNaN(f)?0:f;
}
function formatClockHours(h){
  h=h||0;
  const hh=Math.floor(h);
  const mm=Math.round((h-hh)*60);
  return `${hh}:${pad(mm)}`;
}
function saveCarrySettings(){
  const fare=parseInt(document.getElementById('s-carry-fare').value)||0;
  const hours=parseClockHours(document.getElementById('s-carry-hours').value);
  const days=parseInt(document.getElementById('s-carry-days').value)||0;
  localStorage.setItem('taxi_carry_fare',fare);
  localStorage.setItem('taxi_carry_hours',hours);
  localStorage.setItem('taxi_carry_days',days);
  toast('✅ 繰越を保存しました');
  renderAll();pushSync();
}
function clearCarrySettings(){
  if(!confirm('繰越の設定をクリアしますか？'))return;
  localStorage.removeItem('taxi_carry_fare');
  localStorage.removeItem('taxi_carry_hours');
  localStorage.removeItem('taxi_carry_days');
  loadSettingsInputs();
  toast('🗑 繰越をクリアしました');
  renderAll();pushSync();
}
function saveTargetSettings(){
  localStorage.setItem('taxi_target_days',document.getElementById('s-target-days').value);
  localStorage.setItem('taxi_target_amount',document.getElementById('s-target-amount').value);
  toast('✅ 目標を保存しました');
  renderAll();pushSync();
}
function loadSettingsInputs(){
  document.getElementById('s-name').value=localStorage.getItem('taxi_name')||'';
  document.getElementById('s-sync-code').value=localStorage.getItem('simple_sync_code')||'';
  document.getElementById('s-target-days').value=localStorage.getItem('taxi_target_days')||'';
  document.getElementById('s-target-amount').value=localStorage.getItem('taxi_target_amount')||'';
  document.getElementById('s-carry-fare').value=localStorage.getItem('taxi_carry_fare')||'';
  document.getElementById('s-carry-hours').value=formatClockHours(parseFloat(localStorage.getItem('taxi_carry_hours'))||0);
  document.getElementById('s-carry-days').value=localStorage.getItem('taxi_carry_days')||'';
  const code=localStorage.getItem('simple_sync_code');
  document.getElementById('sync-status').textContent=code?'同期コード設定済み: '+code:'同期コード未設定（この端末だけで記録されます）';
}

// ===== 1日分の記録（出退勤時刻・勤務時間・税抜き売上・自腹高速代をまとめて1件） =====
function getMonthLogs(){
  const log=JSON.parse(localStorage.getItem('simple_daily_log')||'[]');
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  return log.filter(e=>e.startTs>=monthStart);
}
function dailyTargetAmount(){
  const days=parseInt(localStorage.getItem('taxi_target_days')||'0')||0;
  const amount=parseInt(localStorage.getItem('taxi_target_amount')||'0')||0;
  return days>0?Math.round(amount/days):0;
}
function renderSalesTab(){
  const out=document.getElementById('sales-tab-out');
  const targetDays=parseInt(localStorage.getItem('taxi_target_days')||'0')||0;
  const targetAmount=parseInt(localStorage.getItem('taxi_target_amount')||'0')||0;
  const carry=getCarryover();
  const logs=getMonthLogs();
  const workedDays=logs.length+carry.days;
  const totalFare=logs.reduce((a,e)=>a+(e.fare||0),0)+carry.fare;
  const totalHours=logs.reduce((a,e)=>a+(e.durationSec||0),0)/3600+carry.hours;
  const remainDays=Math.max(targetDays-workedDays,0);
  const avgAmount=workedDays>0?Math.round(totalFare/workedDays):0;
  // 記録された1日ごとに30分を加算してから平均する（繰越日数は毎回の記録ではないため対象外）
  const avgHours=workedDays>0?(totalHours+logs.length*0.5)/workedDays:0;
  const perDayTarget=targetDays>0?Math.round(targetAmount/targetDays):0;
  out.innerHTML=`
    <div class="row2"><span class="rl">残り出勤日数</span><span class="rv">${targetDays>0?remainDays+'日':'-'}</span></div>
    <div class="row2"><span class="rl">合計（今月の売上）</span><span class="rv" style="color:var(--green)">¥${totalFare.toLocaleString()}</span></div>
    <div class="row2"><span class="rl">時間（今月の合計勤務時間）</span><span class="rv">${totalHours.toFixed(1)}時間</span></div>
    <div class="row2"><span class="rl">平均金額（1日あたり）</span><span class="rv" style="color:var(--cyan)">${workedDays>0?'¥'+avgAmount.toLocaleString():'-'}</span></div>
    <div class="row2"><span class="rl">1日あたりの営業時間</span><span class="rv" style="color:var(--cyan)">${workedDays>0?avgHours.toFixed(1)+'時間':'-'}</span></div>
    <div class="row2"><span class="rl">1日あたりの目標金額</span><span class="rv" style="color:var(--gold)">${targetDays>0?'¥'+perDayTarget.toLocaleString():'-'}</span></div>
  `;
  renderDailyLogEntries();
}
function renderDailyLogEntries(){
  const el=document.getElementById('daily-log-list');
  const logs=getMonthLogs().slice().sort((a,b)=>b.startTs-a.startTs);
  if(!logs.length){el.innerHTML='<div style="font-size:17px;color:var(--muted)">今月の記録はありません</div>';return;}
  el.innerHTML=logs.map(e=>{
    const h=(e.durationSec/3600).toFixed(1);
    return `<div class="entry-row">
      <div class="entry-main">
        <span style="color:var(--muted)">${e.dateStr}</span>
        <span style="font-weight:700;color:var(--gold);margin-left:6px">${h}時間</span>
        <span style="font-weight:700;color:var(--green);margin-left:6px">¥${(e.fare||0).toLocaleString()}</span>
        ${e.toll?`<span style="color:var(--red);margin-left:6px">高速¥${e.toll.toLocaleString()}</span>`:''}
      </div>
      <button class="entry-btn" onclick="editDailyLog(${e.startTs})">編集</button>
      <button class="entry-btn" style="color:var(--red)" onclick="deleteDailyLog(${e.startTs})">削除</button>
    </div>`;
  }).join('');
}
function editDailyLog(startTs){
  const log=JSON.parse(localStorage.getItem('simple_daily_log')||'[]');
  const idx=log.findIndex(e=>e.startTs===startTs);
  if(idx<0)return;
  const newHours=prompt('勤務時間（時間）',(log[idx].durationSec/3600).toFixed(1));
  if(newHours===null)return;
  const newFare=prompt('本日の税抜き売上（円）',log[idx].fare||0);
  if(newFare===null)return;
  const newToll=prompt('自腹高速代（円）',log[idx].toll||0);
  if(newToll===null)return;
  const h=parseFloat(newHours);
  if(!isNaN(h)&&h>=0){
    log[idx].durationSec=Math.round(h*3600);
    log[idx].endTs=log[idx].startTs+log[idx].durationSec*1000;
  }
  log[idx].fare=parseInt(newFare)||0;
  log[idx].toll=parseInt(newToll)||0;
  localStorage.setItem('simple_daily_log',JSON.stringify(log));
  toast('✅ 記録を更新しました');
  renderAll();pushSync();
}
function deleteDailyLog(startTs){
  if(!confirm('この記録を削除しますか？'))return;
  let log=JSON.parse(localStorage.getItem('simple_daily_log')||'[]');
  log=log.filter(e=>e.startTs!==startTs);
  localStorage.setItem('simple_daily_log',JSON.stringify(log));
  toast('🗑 記録を削除しました');
  renderAll();pushSync();
}

// ===== 出退勤（毎日の入力→勤務中→退勤の3画面） =====
let isDuty=false,dutyStart=null,dutyPlanEndTs=null,pendingPlanHours=0;
let dutyCountdownTimer=null;

function loadDutyState(){
  const raw=localStorage.getItem('simple_duty_state');
  if(!raw)return;
  let st;try{st=JSON.parse(raw);}catch(e){return;}
  if(!st.isDuty)return;
  isDuty=true;dutyStart=new Date(st.dutyStartTs);dutyPlanEndTs=st.planEndTs||null;
}
function saveDutyState(){
  localStorage.setItem('simple_duty_state',JSON.stringify({
    isDuty,dutyStartTs:dutyStart?dutyStart.getTime():null,planEndTs:dutyPlanEndTs
  }));
}
function renderDutyView(){
  const off=document.getElementById('duty-off-view');
  const on=document.getElementById('duty-on-view');
  const hdrStatus=document.getElementById('hdr-status');
  if(isDuty){
    off.style.display='none';on.style.display='block';
    hdrStatus.textContent='乗務中';
    document.getElementById('duty-start-disp').textContent=dutyStart?fmtTime(dutyStart):'-';
    document.getElementById('duty-plan-end-disp').textContent=dutyPlanEndTs?fmtTime(new Date(dutyPlanEndTs)):'-';
    document.getElementById('duty-target-amount-disp').textContent='¥'+dailyTargetAmount().toLocaleString();
    startDutyCountdown();
  }else{
    off.style.display='block';on.style.display='none';
    hdrStatus.textContent='休み中';
    if(dutyCountdownTimer){clearInterval(dutyCountdownTimer);dutyCountdownTimer=null;}
  }
}
function startDutyCountdown(){
  if(dutyCountdownTimer)clearInterval(dutyCountdownTimer);
  updateDutyCountdown();
  dutyCountdownTimer=setInterval(updateDutyCountdown,30000);
}
function updateDutyCountdown(){
  const el=document.getElementById('duty-countdown');
  if(!el)return;
  if(!dutyPlanEndTs){el.textContent='上がり予定時刻が未設定です';el.style.color='var(--muted)';return;}
  const diffMs=dutyPlanEndTs-Date.now();
  const totalMin=Math.floor(Math.abs(diffMs)/60000);
  const h=Math.floor(totalMin/60),m=totalMin%60;
  if(diffMs>=0){el.textContent=`あと ${h}時間${pad(m)}分`;el.style.color='var(--gold)';}
  else{el.textContent=`定時超過 ${h}時間${pad(m)}分`;el.style.color='var(--red)';}
}

function openClockInModal(){
  const now=new Date();
  document.getElementById('ci-start-time').value=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('ci-plan-disp').textContent='未設定';
  document.getElementById('ci-endtime-picker').style.display='none';
  document.getElementById('ci-end-time-input').value='';
  document.getElementById('ci-terminal-check').checked=false;
  pendingPlanHours=0;
  updateConfirmEnabled();
  document.getElementById('clockin-overlay').classList.add('open');
}
function closeClockIn(){document.getElementById('clockin-overlay').classList.remove('open');}
function ciStartTs(){
  const startVal=document.getElementById('ci-start-time').value;
  const base=new Date();
  if(!startVal)return base.getTime();
  const [sh,sm]=startVal.split(':').map(Number);
  return new Date(base.getFullYear(),base.getMonth(),base.getDate(),sh,sm||0,0).getTime();
}
function setPlanHours(hours){
  pendingPlanHours=Math.max(hours,0);
  const h=Math.floor(pendingPlanHours);
  const m=Math.round((pendingPlanHours-h)*60);
  document.getElementById('ci-plan-disp').textContent=`${h}時間${pad(m)}分`;
  updateConfirmEnabled();
}
function planByDailyShare(){
  const targetHours=MONTHLY_TARGET_HOURS_FIXED;
  const targetDays=parseInt(localStorage.getItem('taxi_target_days')||'0')||0;
  const carry=getCarryover();
  const logs=getMonthLogs();
  const workedDays=logs.length+carry.days;
  const workedHours=logs.reduce((a,e)=>a+(e.durationSec||0),0)/3600+carry.hours;
  const remainDays=Math.max(targetDays-workedDays,0);
  const remainHours=Math.max(targetHours-workedHours,0);
  const planHours=remainDays>0?remainHours/remainDays:remainHours;
  document.getElementById('ci-endtime-picker').style.display='none';
  setPlanHours(planHours);
}
function planByEndTime(){
  document.getElementById('ci-endtime-picker').style.display='block';
}
function onManualEndTimeChange(){
  const endVal=document.getElementById('ci-end-time-input').value;
  if(!endVal)return;
  const [eh,em]=endVal.split(':').map(Number);
  const startTs=ciStartTs();
  const base=new Date(startTs);
  let endD=new Date(base.getFullYear(),base.getMonth(),base.getDate(),eh,em,0);
  if(endD.getTime()<=startTs)endD=new Date(endD.getTime()+24*3600*1000);
  setPlanHours((endD.getTime()-startTs)/3600000);
}
function updateConfirmEnabled(){
  const btn=document.getElementById('ci-confirm-btn');
  const checked=document.getElementById('ci-terminal-check').checked;
  btn.disabled=!(checked&&pendingPlanHours>0);
}
function confirmClockIn(){
  const startTs=ciStartTs();
  isDuty=true;
  dutyStart=new Date(startTs);
  dutyPlanEndTs=startTs+Math.round(pendingPlanHours*3600000);
  saveDutyState();
  closeClockIn();
  renderDutyView();
  toast('✅ 出勤しました');
}

function openClockOutModal(){
  const now=new Date();
  document.getElementById('co-end-time').value=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const hrs=dutyStart?Math.max((now.getTime()-dutyStart.getTime())/3600000,0):0;
  document.getElementById('co-hours').value=hrs.toFixed(1);
  document.getElementById('co-fare').value='';
  document.getElementById('co-toll').value='';
  document.getElementById('clockout-overlay').classList.add('open');
}
function closeClockOut(){document.getElementById('clockout-overlay').classList.remove('open');}
function confirmClockOut(){
  const timeVal=document.getElementById('co-end-time').value;
  const hoursVal=parseFloat(document.getElementById('co-hours').value);
  const fare=parseInt(document.getElementById('co-fare').value)||0;
  const toll=parseInt(document.getElementById('co-toll').value)||0;
  if(!fare&&!confirm('本日の売上が0円ですが、このまま退勤しますか？'))return;
  let endTs=Date.now();
  if(timeVal&&dutyStart){
    const [eh,em]=timeVal.split(':').map(Number);
    const base=new Date();
    let d=new Date(base.getFullYear(),base.getMonth(),base.getDate(),eh,em,0);
    if(d.getTime()<dutyStart.getTime())d=new Date(d.getTime()+24*3600*1000);
    endTs=d.getTime();
  }
  const durationSec=(!isNaN(hoursVal)&&hoursVal>=0)
    ?Math.round(hoursVal*3600)
    :Math.max(0,Math.floor((endTs-dutyStart.getTime())/1000));
  const log=JSON.parse(localStorage.getItem('simple_daily_log')||'[]');
  log.push({
    ts:endTs,
    dateStr:new Date(dutyStart.getTime()).toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit'}),
    startTs:dutyStart.getTime(),endTs,durationSec,fare,toll
  });
  localStorage.setItem('simple_daily_log',JSON.stringify(log));
  isDuty=false;dutyStart=null;dutyPlanEndTs=null;
  saveDutyState();
  closeClockOut();
  renderAll();
  pushSync();
  toast('✅ 退勤し、本日の記録を保存しました');
}

function renderAll(){
  renderDutyView();
  renderSalesTab();
  const name=localStorage.getItem('taxi_name');
  document.getElementById('hdr-name').textContent=name?name+'さん':'出退勤・売上管理';
}

// ===== 端末間同期（Firebaseバックアップ） =====
function syncPath(){
  const code=(localStorage.getItem('simple_sync_code')||'').trim();
  return code?'simple_backup/'+encodeURIComponent(code):null;
}
function saveSyncSettings(){
  const name=document.getElementById('s-name').value.trim();
  const code=document.getElementById('s-sync-code').value.trim();
  localStorage.setItem('taxi_name',name);
  localStorage.setItem('simple_sync_code',code);
  renderAll();
  if(!code){document.getElementById('sync-status').textContent='同期コード未設定（この端末だけで記録されます）';toast('✅ 保存しました');return;}
  pushSync(()=>{
    document.getElementById('sync-status').textContent='最終送信: '+new Date().toLocaleString('ja-JP');
    toast('✅ 保存してサーバーに送信しました');
  });
}
function pushSync(cb){
  const path=syncPath();
  if(!path||!db)return;
  const snapshot={
    name:localStorage.getItem('taxi_name')||'',
    dailyLog:JSON.parse(localStorage.getItem('simple_daily_log')||'[]'),
    carryFare:localStorage.getItem('taxi_carry_fare')||'0',
    carryHours:localStorage.getItem('taxi_carry_hours')||'0',
    carryDays:localStorage.getItem('taxi_carry_days')||'0',
    targetDays:localStorage.getItem('taxi_target_days')||'',
    targetAmount:localStorage.getItem('taxi_target_amount')||'',
    updatedTs:Date.now()
  };
  db.ref(path).set(snapshot,()=>{if(cb)cb();});
}
function applyRemoteSnapshot(v,fallbackName){
  localStorage.setItem('taxi_name',v.name||fallbackName||'');
  localStorage.setItem('simple_daily_log',JSON.stringify(v.dailyLog||[]));
  localStorage.setItem('taxi_carry_fare',v.carryFare||'0');
  localStorage.setItem('taxi_carry_hours',v.carryHours||'0');
  localStorage.setItem('taxi_carry_days',v.carryDays||'0');
  if(v.targetDays)localStorage.setItem('taxi_target_days',v.targetDays);
  if(v.targetAmount)localStorage.setItem('taxi_target_amount',v.targetAmount);
}
function restoreFromSync(){
  const code=document.getElementById('s-sync-code').value.trim();
  if(!code){toast('⚠️ 同期コードを入力してください');return;}
  if(!db){toast('⚠️ Firebase未接続です');return;}
  if(!confirm('サーバー側のデータでこの端末を上書きします。よろしいですか？'))return;
  db.ref('simple_backup/'+encodeURIComponent(code)).once('value',snap=>{
    const v=snap.val();
    if(!v){toast('⚠️ このコードのデータが見つかりません');return;}
    localStorage.setItem('simple_sync_code',code);
    applyRemoteSnapshot(v);
    loadSettingsInputs();renderAll();
    document.getElementById('sync-status').textContent='復元完了: '+new Date(v.updatedTs||Date.now()).toLocaleString('ja-JP');
    toast('✅ サーバーのデータを復元しました');
  });
}

// ===== 初回起動時の設定画面（新規の人向け） =====
function checkFirstRun(){
  if(localStorage.getItem('simple_setup_done')==='1')return;
  const hasData=localStorage.getItem('taxi_name')||localStorage.getItem('simple_daily_log');
  if(hasData){
    localStorage.setItem('simple_setup_done','1');
    return;
  }
  document.getElementById('setup-screen').classList.add('open');
}
function finishSetup(){
  localStorage.setItem('simple_setup_done','1');
  loadSettingsInputs();renderAll();loadDutyState();renderDutyView();
  document.getElementById('setup-screen').classList.remove('open');
}
function completeSetup(restore){
  const name=document.getElementById('setup-name').value.trim();
  const code=document.getElementById('setup-sync-code').value.trim();
  if(restore){
    if(!code){toast('⚠️ 復元するには同期コードを入力してください');return;}
    if(!db){toast('⚠️ サーバーに接続できません。しばらくしてから再度お試しください');return;}
    db.ref('simple_backup/'+encodeURIComponent(code)).once('value',snap=>{
      const v=snap.val();
      if(!v){toast('⚠️ このコードのデータが見つかりません');return;}
      localStorage.setItem('simple_sync_code',code);
      applyRemoteSnapshot(v,name);
      finishSetup();
      toast('✅ 前回までのデータを復元しました');
    });
    return;
  }
  if(!name){toast('⚠️ 名前を入力してください');return;}
  localStorage.setItem('taxi_name',name);
  if(code)localStorage.setItem('simple_sync_code',code);
  finishSetup();
  if(code)pushSync();
  toast('✅ ようこそ！さっそく出勤ボタンから記録を始められます');
}

// ===== 更新チェック =====
async function checkForUpdate(){
  if(location.protocol==='file:')return;
  try{
    const res=await fetch(location.pathname+'?_cb='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const html=await res.text();
    const m=html.match(/const APP_BUILD=['"]([^'"]+)['"]/);
    if(m&&m[1]&&m[1]!==APP_BUILD)showUpdateBanner();
  }catch(e){}
}
function showUpdateBanner(){
  if(document.getElementById('update-banner'))return;
  const b=document.createElement('div');
  b.id='update-banner';
  b.textContent='🔄 アプリの更新があります。タップして最新の状態に更新してください';
  b.onclick=()=>location.reload();
  document.body.appendChild(b);
}

function init(){
  tryFirebase();
  loadSettingsInputs();
  loadDutyState();
  renderAll();
  checkFirstRun();
  setTimeout(checkForUpdate,4000);
  setInterval(checkForUpdate,5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate();});
}
init();
</script>
