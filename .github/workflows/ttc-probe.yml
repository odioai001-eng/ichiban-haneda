name: ttc-probe
# 一時的な接続確認用（確認が終わったら、このブランチごと削除します）
on:
  push:
    branches: [ttc-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: python3 .github/ttc-probe/probe.py
