name: 運行情報の自動更新

on:
  schedule:
    # UTC基準。日本時間(JST)は UTC+9。人身事故・故障は解消も早いため15分おきに確認する
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # 手動実行もできるようにしておく

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4 lxml

      - name: 運行情報を取得してページを生成
        run: python scripts/update_train_status.py

      - name: 変更があればコミット・反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add train_status_hub.html
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "自動更新: 運行情報ハブ ($(date '+%Y-%m-%d %H:%M'))"
            git push
          fi
