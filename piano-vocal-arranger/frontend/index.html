<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piano+Vocal Arranger</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #0f1115; color: #eee; }
  h1 { font-size: 1.4rem; }
  fieldset { border: 1px solid #333; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; }
  legend { padding: 0 6px; color: #9ad; }
  label { display: block; margin: 8px 0 4px; }
  input[type="range"] { width: 100%; }
  select, input[type="file"] { width: 100%; padding: 6px; background: #1a1d24; color: #eee; border: 1px solid #333; border-radius: 6px; }
  button { width: 100%; padding: 12px; font-size: 1rem; background: #4f7cff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
  button:disabled { background: #444; cursor: not-allowed; }
  #status { margin-top: 12px; min-height: 1.4em; color: #9ad; }
  audio { width: 100%; margin-top: 12px; }
  .levelrow { display: flex; align-items: center; gap: 8px; }
  .levelrow span { width: 70px; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>🎹🎤 → 🎸🥁 バンドアレンジャー</h1>
<p>ピアノ＋ボーカルの音源をアップロードすると、ベース・ギター・ドラムを自動で足したミックスを作ります。</p>

<form id="form">
  <fieldset>
    <legend>音源</legend>
    <input type="file" id="fileInput" accept="audio/*" required />
  </fieldset>

  <fieldset>
    <legend>ジャンル</legend>
    <select id="genre">
      <option value="rock">ロック</option>
      <option value="ballad">バラード</option>
      <option value="bossa">ボサノバ</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>バランス</legend>
    <div class="levelrow"><span>原曲</span><input type="range" id="original_level" min="0" max="1.5" step="0.05" value="1.0" /></div>
    <div class="levelrow"><span>ベース</span><input type="range" id="bass_level" min="0" max="1.5" step="0.05" value="0.9" /></div>
    <div class="levelrow"><span>ギター</span><input type="range" id="guitar_level" min="0" max="1.5" step="0.05" value="0.7" /></div>
    <div class="levelrow"><span>ドラム</span><input type="range" id="drums_level" min="0" max="1.5" step="0.05" value="0.8" /></div>
  </fieldset>

  <button type="submit" id="submitBtn">アレンジする</button>
</form>

<div id="status"></div>
<audio id="player" controls hidden></audio>
<a id="downloadLink" hidden download="arranged.wav">ダウンロード</a>

<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const player = document.getElementById('player');
const downloadLink = document.getElementById('downloadLink');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;

  const fd = new FormData();
  fd.append('file', file);
  fd.append('genre', document.getElementById('genre').value);
  fd.append('original_level', document.getElementById('original_level').value);
  fd.append('bass_level', document.getElementById('bass_level').value);
  fd.append('guitar_level', document.getElementById('guitar_level').value);
  fd.append('drums_level', document.getElementById('drums_level').value);

  submitBtn.disabled = true;
  statusEl.textContent = '解析＆アレンジ中…（曲の長さによって数十秒かかります）';
  player.hidden = true;
  downloadLink.hidden = true;

  try {
    const res = await fetch('/api/arrange', { method: 'POST', body: fd });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || res.statusText);
    }
    const tempo = res.headers.get('X-Tempo');
    const chords = res.headers.get('X-Chords');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    player.src = url;
    player.hidden = false;
    downloadLink.href = url;
    downloadLink.hidden = false;
    statusEl.textContent = `完了！ テンポ: ${tempo} BPM / コード進行: ${chords}`;
  } catch (err) {
    statusEl.textContent = 'エラー: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
